name: Corona auto source probe

on:
  push:
    branches:
      - probe/corona-50-auto
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Syntax check
        run: |
          node --check scripts/probe-corona-strict.mjs
          python -m py_compile scripts/audit-corona-strict.py

      - name: Strict probe all candidate sources
        id: probe
        continue-on-error: true
        env:
          PROBE_TIMEOUT_MS: '20000'
          PROBE_CONCURRENCY: '8'
          PROBE_MAX_DISTANCE: '2200'
        run: node scripts/probe-corona-strict.mjs

      - name: Canonicalize price tuples
        if: always()
        run: python scripts/audit-corona-strict.py

      - name: Upload strict and canonical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corona-canonical-probe-results
          path: |
            corona-strict-probe-results.json
            corona-canonical-audit.json
          if-no-files-found: error

      - name: Enforce canonical 50-country threshold
        if: always()
        run: |
          node -e "const r=require('./corona-canonical-audit.json'); console.log('CANONICAL PASS',r.canonicalPassedCountries,'/',79); if(!r.thresholdMet) process.exit(2)"
